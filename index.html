<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CartoCraft - Ultimate Edition</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>

    <style>
        :root {
            --primary: #FACC15; 
            --primary-hover: #EAB308;
            --success: #10B981;
            --danger: #EF4444;
            --info: #3b82f6;
            --glass-bg: rgba(15, 23, 42, 0.88);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Poppins', sans-serif; overflow: hidden; background: #000; }

        #map-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; cursor: crosshair; }
        .leaflet-control-attribution { display: none !important; }

        .glass-panel {
            background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            border-radius: 16px; color: white; z-index: 10;
        }

        .top-bar { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 20px; padding: 10px 25px; }
        .target-country { font-size: 1.6rem; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
        .target-subtitle { font-size: 0.75rem; color: var(--primary); text-transform: uppercase; font-weight: 800; letter-spacing: 1px; margin-top: -3px; }
        
        .timer-container { display: flex; align-items: center; gap: 10px; padding-left: 15px; border-left: 2px solid rgba(255,255,255,0.2); }
        .timer-val { font-size: 1.8rem; font-weight: 900; font-variant-numeric: tabular-nums; width: 50px; text-align: center; }
        .timer-bar-bg { width: 100px; height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; overflow: hidden; }
        .timer-bar-fill { height: 100%; width: 100%; background: var(--success); border-radius: 5px; transition: width 1s linear, background-color 0.3s; }

        /* Encart Astuce */
        .astuce-panel {
            position: absolute; top: 100px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.2), rgba(16, 185, 129, 0.2));
            border: 1px solid rgba(59, 130, 246, 0.4); padding: 5px 15px; border-radius: 10px;
            font-size: 0.8rem; color: #93c5fd; font-weight: 600; z-index: 10; text-align: center; max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); backdrop-filter: blur(8px);
        }

        .hints-panel { 
            position: absolute; top: 145px; left: 50%; transform: translateX(-50%); 
            display: flex; gap: 8px; z-index: 10; background: rgba(15, 23, 42, 0.95);
            padding: 6px 12px; border-radius: 12px; border: 1px solid rgba(250, 204, 21, 0.3);
        }
        .hint-btn { background: rgba(30, 41, 59, 0.9); border: 1px solid rgba(255,255,255,0.15); color: #cbd5e1; padding: 5px 10px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; font-family: 'Poppins', sans-serif; font-weight: 600;}
        .hint-btn:disabled { opacity: 0.4; border-color: var(--success); color: var(--success); }

        .score-panel { position: absolute; top: 20px; left: 20px; padding: 12px 18px; display: flex; gap: 15px; }
        .score-item { display: flex; flex-direction: column; position: relative; }
        .score-label { font-size: 0.65rem; text-transform: uppercase; color: #94A3B8; font-weight: 600; }
        .score-value { font-size: 1.2rem; font-weight: 800; }

        #combo-badge {
            position: absolute; top: -15px; right: -12px;
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            color: white; padding: 2px 6px; border-radius: 10px;
            font-size: 0.65rem; font-weight: 900; opacity: 0; transform: scale(0.5); transition: all 0.3s;
        }
        #combo-badge.active { opacity: 1; transform: scale(1); }

        /* Jauge de score glossy & dopaminergique (Droite) */
        .glossy-gauge-container {
            position: absolute; top: 20px; right: 20px; width: 24px; height: 200px;
            background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px; overflow: hidden; z-index: 10; display: none;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6), inset 0 0 10px rgba(0,0,0,0.8);
            padding: 3px; box-sizing: border-box;
        }
        .glossy-gauge-fill {
            width: 100%; height: 0%; background: linear-gradient(180deg, #10B981, #FACC15, #EF4444);
            border-radius: 8px; transition: height 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.5), 0 0 15px rgba(250, 204, 21, 0.6);
            position: relative;
        }
        .glossy-gauge-fill::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%;
            background: linear-gradient(180deg, rgba(255,255,255,0.4), transparent);
            border-radius: 8px 8px 0 0; pointer-events: none;
        }

        #hint-notification { position: absolute; top: 200px; left: 50%; transform: translateX(-50%); padding: 6px 15px; border-radius: 20px; font-weight: 600; font-size: 0.8rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 20;}

        .bottom-actions { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 10; width: 90%; max-width: 500px; justify-content: center; }
        .btn {
            font-family: 'Poppins', sans-serif; padding: 12px 20px; font-size: 0.95rem; font-weight: 800; border: none; border-radius: 30px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 8px 15px rgba(0,0,0,0.3); flex: 1; text-align: center;
        }
        .btn-clear { background: rgba(255,255,255,0.15); color: white; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .btn-undo { background: rgba(59, 130, 246, 0.3); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.4); backdrop-filter: blur(10px); }
        .btn-validate { background: var(--primary); color: #000; }

        #dopamine-popup {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 30px; border-radius: 24px; text-align: center; width: 85%; max-width: 400px;
            opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 0 1px rgba(255,255,255,0.2); z-index: 50;
        }
        #dopamine-popup.active { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .dopa-title { font-size: 1.2rem; color: #94A3B8; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        .dopa-pct { font-size: 4rem; font-weight: 900; line-height: 1; margin-bottom: 5px; color: var(--primary); text-shadow: 0 0 20px rgba(250, 204, 21, 0.5); }
        .dopa-pts { font-size: 1.3rem; font-weight: 600; color: var(--success); margin-bottom: 20px; }
        .dopa-msg { font-size: 1rem; margin-bottom: 20px; font-weight: 600; }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(10px); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; padding: 20px; box-sizing: border-box; text-align: center;}
        .overlay-title { font-size: 3rem; font-weight: 900; margin-bottom: 10px; background: linear-gradient(135deg, #FACC15, #EAB308); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .instructions-box { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.1); max-width: 500px; width: 100%; margin-bottom: 20px; box-sizing: border-box;}
        .instructions-box p { margin: 8px 0; color: #cbd5e1; font-size: 0.95rem; line-height: 1.4; }

        .region-select { margin-top: 10px; padding: 10px 15px; font-size: 1rem; font-family: 'Poppins', sans-serif; font-weight: 600; border-radius: 8px; background: rgba(15, 23, 42, 0.8); color: white; border: 1px solid var(--primary); outline: none; width: 100%; }
        .region-select option { background: #0f172a; }

        .menu-buttons { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 400px; }
        .btn-mode-chrono { background: var(--danger); color: white; flex: 1; }
        .btn-mode-zen { background: var(--success); color: white; flex: 1; }

        .settings-bar { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
        .lang-selector { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
        .lang-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 4px 10px; border-radius: 15px; cursor: pointer; font-size: 0.85rem; }
        .lang-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }

        @media (max-width: 768px) {
            .score-panel { top: 10px; left: 10px; padding: 8px 12px; gap: 10px; }
            .score-value { font-size: 1.1rem; }
            .top-bar { top: 75px; left: 10px; transform: none; width: auto; max-width: 95vw; padding: 8px 15px; justify-content: space-between; }
            .target-country { font-size: 1.2rem; }
            .astuce-panel { top: 132px; left: 10px; transform: none; font-size: 0.7rem; padding: 4px 10px; }
            .hints-panel { top: 172px; left: 10px; transform: none; padding: 5px 10px; gap: 5px; }
            .hint-btn { padding: 4px 8px; font-size: 0.65rem; }
            .glossy-gauge-container { top: 10px; right: 10px; height: 150px; width: 18px; }
            .bottom-actions { bottom: 15px; width: 95%; gap: 6px; }
            .btn { padding: 10px 10px; font-size: 0.8rem; }
            .overlay-title { font-size: 2.5rem; }
        }
        .panning { cursor: grabbing !important; }
    </style>
</head>
<body>

    <div id="map-container"></div>

    <div class="glass-panel top-bar" id="game-ui" style="display: none;">
        <div>
            <div class="target-country" id="target-title"><span id="target-flag">🇫🇷</span> <span id="target-name">France</span></div>
            <div class="target-subtitle" id="target-subtitle">Frontières Terrestres</div>
        </div>
        <div class="timer-container" id="timer-container">
            <div class="timer-val" id="timer-val">30</div>
            <div class="timer-bar-bg"><div class="timer-bar-fill" id="timer-bar"></div></div>
        </div>
    </div>

    <!-- Encart Astuce -->
    <div class="astuce-panel" id="astuce-panel" style="display: none;">
        Astuce :
    </div>

    <div class="hints-panel" id="hints-panel" style="display: none;">
        <button class="hint-btn" id="hint-1" onclick="triggerHint(1)">💡 Centre</button>
        <button class="hint-btn" id="hint-2" onclick="triggerHint(2)">💡 Voisins</button>
        <button class="hint-btn" id="hint-3" onclick="triggerHint(3)">💡 Tous</button>
    </div>

    <div class="glass-panel score-panel" id="score-ui" style="display: none;">
        <div class="score-item"><span class="score-label" id="lbl-round">Manche</span><span class="score-value" id="round-val">1/5</span></div>
        <div class="score-item">
            <span class="score-label" id="lbl-score">Score</span>
            <span class="score-value" id="score-val">0</span>
            <div id="combo-badge">🔥 x1.0</div>
        </div>
    </div>

    <!-- Jauge Glossy Dopaminergique Droite -->
    <div class="glossy-gauge-container" id="glossy-gauge">
        <div class="glossy-gauge-fill" id="glossy-gauge-fill"></div>
    </div>

    <div class="glass-panel" id="hint-notification">Indice activé !</div>

    <div class="bottom-actions" id="actions-ui" style="display: none;">
        <button class="btn btn-clear" id="btn-clear" onclick="clearDrawing()">Effacer</button>
        <button class="btn btn-undo" id="btn-undo" onclick="undoDrawing()">Annuler</button>
        <button class="btn btn-validate" id="btn-validate" onclick="validateDrawing()">Valider</button>
    </div>

    <div class="glass-panel" id="dopamine-popup">
        <div class="dopa-title" id="dopa-title">Précision</div>
        <div class="dopa-pct" id="dopa-pct">0%</div>
        <div class="dopa-pts" id="dopa-pts">+ 0 pts</div>
        <div class="dopa-msg" id="dopa-msg">Bien joué !</div>
        <button class="btn btn-validate" id="btn-next" onclick="nextRound()">Suivant ➔</button>
    </div>

    <div class="overlay" id="loading-overlay">
        <div class="overlay-title">CartoCraft</div>
        
        <div class="settings-bar">
            <div class="lang-selector">
                <button class="lang-btn active" onclick="setLang('fr')">🇫🇷 FR</button>
                <button class="lang-btn" onclick="setLang('en')">🇬🇧 EN</button>
                <button class="lang-btn" onclick="setLang('es')">🇪🇸 ES</button>
                <button class="lang-btn" onclick="setLang('de')">🇩🇪 DE</button>
                <button class="lang-btn" onclick="setLang('it')">🇮🇹 IT</button>
            </div>
        </div>

        <div class="instructions-box">
            <div id="instructions-content"></div>
            <select id="region-select" class="region-select"></select>
        </div>
        
        <div class="menu-buttons" id="menu-buttons" style="display: none;">
            <button class="btn btn-mode-chrono" id="btn-chrono" onclick="startGame('chrono')">⏱️ Chrono (3-1-1)</button>
            <button class="btn btn-mode-zen" id="btn-zen" onclick="startGame('zen')">🧘 Zen</button>
        </div>
    </div>

    <script>
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSfxClick() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.04);
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.04);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.04);
        }

        function playSfxRelease() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(120, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.06);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.06);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.06);
        }

        function playSfxScore() {
            if (!audioCtx) return;
            const chords = [261.63, 329.63, 392.00, 523.25];
            chords.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + (idx * 0.06));
                gain.gain.setValueAtTime(0, audioCtx.currentTime + (idx * 0.06));
                gain.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + (idx * 0.06) + 0.02);
                gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + (idx * 0.06) + 0.3);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + (idx * 0.06));
                osc.stop(audioCtx.currentTime + (idx * 0.06) + 0.3);
            });
        }
    </script>

        let currentLang = 'fr';

        function updateUI() {
            const t = i18n[currentLang];
            document.getElementById('instructions-content').innerHTML = t.instructions;
            document.getElementById('btn-chrono').innerText = t.chrono;
            document.getElementById('btn-zen').innerText = t.zen;

            if (currentCountryFull) {

            select.innerHTML = '';
            Object.entries(t.regions).forEach(([key, name]) => {

        }

        // --- MOTEUR DE JEU ---
        const map = L.map('map-container', { 
            doubleClickZoom: false,

            dragging: true, 
            touchZoom: true,

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 12 }).addTo(map);
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', { maxZoom: 12, opacity: 0.6 }).addTo(map);

        let globalTopology, worldFeatures = [], currentCountryFull = null, currentLandBorders = null;
        let worldGeometries = [], countryNeighborsMap = [], actualNeighbors = [];
        let round = 1, totalScore = 0, maxPointsRound = 10000;
        let timeLeft = 30, timerInterval, hintLevel = 0, activeMode = 'chrono'; 
        let gameSequence = []; 
        let comboCount = 0, currentMultiplier = 1.0;

        let isDrawing = false, userPaths = [], currentPath = [], drawnLayers = L.layerGroup().addTo(map);
        let activeHintLayers = [], targetLayer = null, gameActive = false;

        const regionMap = {
            'europe': ["Albania", "Austria", "Belarus", "Belgium", "Bosnia and Herz.", "Bulgaria", "Croatia", "Czechia", "Denmark", "Estonia", "Finland", "France", "Germany", "Greece", "Hungary", "Ireland", "Italy", "Latvia", "Lithuania", "Luxembourg", "Moldova", "Montenegro", "Netherlands", "North Macedonia", "Norway", "Poland", "Portugal", "Romania", "Russia", "Serbia", "Slovakia", "Slovenia", "Spain", "Sweden", "Switzerland", "Ukraine", "United Kingdom"],
            'namerica': ["Canada", "United States of America", "Mexico", "Greenland"],
            'samerica': ["Argentina", "Bolivia", "Brazil", "Chile", "Colombia", "Ecuador", "Guyana", "Paraguay", "Peru", "Suriname", "Uruguay", "Venezuela"],
            'africa': ["Algeria", "Angola", "Benin", "Botswana", "Burkina Faso", "Burundi", "Cameroon", "Central African Rep.", "Chad", "Congo", "Côte d'Ivoire", "Dem. Rep. Congo", "Djibouti", "Egypt", "Eq. Guinea", "Eritrea", "Eswatini", "Ethiopia", "Gabon", "Gambia", "Ghana", "Guinea", "Guinea-Bissau", "Kenya", "Lesotho", "Liberia", "Libya", "Madagascar", "Malawi", "Mali", "Mauritania", "Morocco", "Mozambique", "Namibia", "Niger", "Nigeria", "Rwanda", "Senegal", "Sierra Leone", "Somalia", "South Africa", "S. Sudan", "Sudan", "Tanzania", "Togo", "Tunisia", "Uganda", "Zambia", "Zimbabwe"],

        d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(data => {
            globalTopology = data;
            worldGeometries = data.objects.countries.geometries;
            worldFeatures = topojson.feature(data, data.objects.countries).features;
            countryNeighborsMap = topojson.neighbors(worldGeometries);
            updateUI();
            document.getElementById('menu-buttons').style.display = "flex";
        });

        const mapDiv = document.getElementById('map-container');

        function startStroke(clientX, clientY) {
            if (!gameActive) return;
            initAudio();
            isDrawing = true;
            playSfxClick();
            const latlng = map.containerPointToLatLng([clientX, clientY]);
            currentPath = [latlng];
            currentPolyline = L.polyline(currentPath, { color: '#FACC15', weight: 4 }).addTo(drawnLayers);
        }

        function moveStroke(clientX, clientY) {
            if (!gameActive || !isDrawing) return;
            const latlng = map.containerPointToLatLng([clientX, clientY]);
            currentPath.push(latlng);
            if(currentPolyline) currentPolyline.setLatLngs(currentPath);
        }

        function endStroke() {
            if (!gameActive || !isDrawing) return;
            isDrawing = false;
            playSfxRelease();
            if (currentPath.length > 1) { userPaths.push([...currentPath]); } 
            else if (currentPolyline) { drawnLayers.removeLayer(currentPolyline); }
            currentPath = []; currentPolyline = null;
        }

        // Gestion Souris propre (Pas de blocage permanent du drag)
        mapDiv.addEventListener('mousedown', (e) => {
            if (e.button === 0 && !e.shiftKey) {
                startStroke(e.clientX, e.clientY);
            }
        });
        mapDiv.addEventListener('mousemove', (e) => {
            moveStroke(e.clientX, e.clientY);
        });
        window.addEventListener('mouseup', endStroke);

        // Tactile mobile (1 doigt dessine, 2 doigts bougent la carte)
        mapDiv.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                const touch = e.touches[0];
                startStroke(touch.clientX, touch.clientY);
            } else if (e.touches.length >= 2) {
                isDrawing = false;
                if (currentPolyline) { drawnLayers.removeLayer(currentPolyline); }
                currentPath = []; currentPolyline = null;
            }
        }, {passive: true});

        mapDiv.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && isDrawing) {
                const touch = e.touches[0];
                moveStroke(touch.clientX, touch.clientY);
            }
        }, {passive: true});

        window.addEventListener('touchend', endStroke);

        window.addEventListener('keydown', e => { 
            if(!gameActive) return;
            if(e.code === 'Space') { e.preventDefault(); validateDrawing(); }
            if((e.ctrlKey || e.metaKey) && e.code === 'KeyZ') { e.preventDefault(); undoDrawing(); }
        });

        function clearDrawing() { userPaths = []; drawnLayers.clearLayers(); }
        function undoDrawing() {
            if (userPaths.length > 0) {
                userPaths.pop(); drawnLayers.clearLayers();
                userPaths.forEach(pts => { L.polyline(pts, { color: '#FACC15', weight: 4 }).addTo(drawnLayers); });
            }
        }

        function startTimer() {
            if (activeMode !== 'chrono') return;
            timeLeft = 30; hintLevel = 0;
            const timerVal = document.getElementById('timer-val'), timerBar = document.getElementById('timer-bar');
            timerVal.innerText = timeLeft; timerVal.style.color = "white";
            timerBar.style.width = "100%"; timerBar.style.backgroundColor = "var(--success)";

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if(!gameActive) return clearInterval(timerInterval);
                timeLeft--;
                timerVal.innerText = timeLeft; timerBar.style.width = `${(timeLeft/30)*100}%`;

                if (timeLeft === 20 && hintLevel < 1) { triggerHint(1, true); timerVal.style.color = "#F59E0B"; timerBar.style.backgroundColor = "#F59E0B"; } 
                else if (timeLeft === 12 && hintLevel < 2) { triggerHint(2, true); timerVal.style.color = "var(--danger)"; timerBar.style.backgroundColor = "var(--danger)"; } 
                else if (timeLeft === 5 && hintLevel < 3) { triggerHint(3, true); }
                else if (timeLeft === 0) { clearInterval(timerInterval); validateDrawing(); }
            }, 1000);
        }

        function triggerHint(level, isAuto = false) {
            if (level <= hintLevel) return;
            hintLevel = level; 
            const notif = document.getElementById('hint-notification');
            
            if (level === 1) {
                maxPointsRound = 8500;
                const centroid = d3.geoCentroid(currentCountryFull);
                activeHintLayers.push(L.circleMarker([centroid[1], centroid[0]], { color: '#FACC15', radius: 6, weight: 3, fillColor: '#FACC15', fillOpacity: 0.8 }).addTo(map));
                if(isAuto && activeMode === 'chrono') { notif.innerText = "Indice Centre activé !"; notif.style.background = "rgba(245, 158, 11, 0.8)"; }
                document.getElementById('hint-1').disabled = true;
            } 
            if (level === 2) {
                maxPointsRound = 6500;
                let someNeighbors = actualNeighbors.sort(() => 0.5 - Math.random()).slice(0, Math.max(1, Math.ceil(actualNeighbors.length / 2)));
                activeHintLayers.push(L.geoJSON(someNeighbors, { style: { color: '#ef4444', weight: 2, fill: false, opacity: 0.5 } }).addTo(map));
                if(isAuto && activeMode === 'chrono') { notif.innerText = "Indice Voisins activé !"; notif.style.background = "rgba(239, 68, 68, 0.8)"; }
                document.getElementById('hint-1').disabled = true;
                document.getElementById('hint-2').disabled = true;
            } 
            if (level === 3) {
                maxPointsRound = 4000;
                activeHintLayers.push(L.geoJSON(actualNeighbors, { style: { color: '#ef4444', weight: 2, fill: false, opacity: 0.8 } }).addTo(map));
                if(isAuto && activeMode === 'chrono') { notif.innerText = "Indice Tous Voisins activé !"; notif.style.background = "rgba(239, 68, 68, 1)"; }
                document.getElementById('hint-1').disabled = true;
                document.getElementById('hint-2').disabled = true;
                document.getElementById('hint-3').disabled = true;
            }
            
            if(isAuto && activeMode === 'chrono') { notif.style.opacity = 1; setTimeout(() => { notif.style.opacity = 0; }, 3000); }
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function buildGameSequence(region) {
            let pool = worldFeatures.filter(f => f.geometry && f.geometry.coordinates.length > 0);
            if (region !== 'all' && regionMap[region]) {
                pool = pool.filter(f => regionMap[region].includes(f.properties.name));
            }

            let easy = pool.filter(f => (!countryDataMap[f.properties.name] || countryDataMap[f.properties.name].diff === 1));
            let medium = pool.filter(f => (countryDataMap[f.properties.name] && countryDataMap[f.properties.name].diff === 2));
            let hard = pool.filter(f => (countryDataMap[f.properties.name] && countryDataMap[f.properties.name].diff === 3));

            shuffleArray(easy);
            shuffleArray(medium);
            shuffleArray(hard);

            gameSequence = [];
            for(let i=0; i<3 && easy.length > 0; i++) gameSequence.push(easy.pop());
            if(medium.length > 0) gameSequence.push(medium.pop()); else if(easy.length > 0) gameSequence.push(easy.pop());
            if(hard.length > 0) gameSequence.push(hard.pop()); else if(medium.length > 0) gameSequence.push(medium.pop()); else if(easy.length > 0) gameSequence.push(easy.pop());

            while(gameSequence.length < 5 && pool.length > 0) {
                let randomRem = pool[Math.floor(Math.random()*pool.length)];
                if(!gameSequence.includes(randomRem)) gameSequence.push(randomRem);
            }
        }

        function startGame(mode) {
            initAudio();
            const regionSelect = document.getElementById('region-select');
            buildGameSequence(regionSelect ? regionSelect.value : 'all');
            
            activeMode = mode; round = 1; totalScore = 0; comboCount = 0; currentMultiplier = 1.0;
            document.getElementById('score-val').innerText = "0";
            document.getElementById('timer-container').style.display = mode === 'zen' ? 'none' : 'flex';
            document.getElementById('glossy-gauge').style.display = 'block';
            updateGlossyGauge(20); // Manche 1 commence à 20%
            startRound();
        }

        function updateGlossyGauge(pct) {
            const fill = document.getElementById('glossy-gauge-fill');
            fill.style.height = `${Math.min(100, Math.max(0, pct))}%`;
        }

        function startRound() {
            if (round > 5 || gameSequence.length === 0) return endGame();
            
            document.getElementById('loading-overlay').style.display = "none";
            document.getElementById('dopamine-popup').classList.remove('active');
            setTimeout(() => document.getElementById('dopamine-popup').style.display = "none", 300);

            document.getElementById('game-ui').style.display = "flex"; 
            document.getElementById('score-ui').style.display = "flex"; 
            document.getElementById('actions-ui').style.display = "flex";
            document.getElementById('hints-panel').style.display = "flex"; 
            document.getElementById('astuce-panel').style.display = "block";
            [1,2,3].forEach(i => document.getElementById(`hint-${i}`).disabled = false);

            currentCountryFull = gameSequence[round - 1];
            
            currentLandBorders = topojson.mesh(globalTopology, globalTopology.objects.countries, function(a, b) {
                return a !== b && (a.id === currentCountryFull.id || b.id === currentCountryFull.id);
            });
            
            const isIsland = (!currentLandBorders || currentLandBorders.coordinates.length === 0);
            if (isIsland) {
                currentLandBorders = topojson.mesh(globalTopology, globalTopology.objects.countries, function(a, b) {
                    return a === b && a.id === currentCountryFull.id;
                });
                document.getElementById('target-subtitle').innerText = i18n[currentLang].islandCoast;
            } else {
                document.getElementById('target-subtitle').innerText = i18n[currentLang].bordersOnly;
            }
            
            let currentCountryIndex = worldGeometries.findIndex(g => g.id === currentCountryFull.id);
            let neighborIndices = countryNeighborsMap[currentCountryIndex] || [];
            actualNeighbors = neighborIndices.map(i => worldFeatures[i]);
            
            maxPointsRound = 10000;
            if (targetLayer) map.removeLayer(targetLayer);
            activeHintLayers.forEach(layer => map.removeLayer(layer)); activeHintLayers = []; clearDrawing();
            
            map.fitBounds(L.geoJSON(currentCountryFull).getBounds(), { padding: [80, 80], maxZoom: 6 });

            const info = getLocalizedCountryInfo(currentCountryFull);
            document.getElementById('target-flag').innerText = info[1];
            document.getElementById('target-name').innerText = info[0];
            document.getElementById('round-val').innerText = `${round}/5`;
            
            gameActive = true; 
            if(activeMode === 'chrono') startTimer();
        }

        function validateDrawing() {
            clearInterval(timerInterval); gameActive = false;
            document.getElementById('actions-ui').style.display = "none";
            document.getElementById('hints-panel').style.display = "none";
            document.getElementById('astuce-panel').style.display = "none";

            if (userPaths.length === 0) userPaths = [[map.getCenter(), map.getCenter()]]; 
            
            drawnLayers.clearLayers();
            userPaths.forEach(pts => { L.polyline(pts, { color: '#FACC15', weight: 4 }).addTo(drawnLayers); });

            const size = map.getSize(), offCanvas = document.createElement('canvas');
            offCanvas.width = size.x; offCanvas.height = size.y;
            const ctx = offCanvas.getContext('2d', { willReadFrequently: true });
            
            const transform = d3.geoTransform({point: function(x, y) { const p = map.latLngToContainerPoint(new L.LatLng(y, x)); this.stream.point(p.x, p.y); }});
            const path = d3.geoPath().projection(transform).context(ctx);

            ctx.strokeStyle = 'rgb(255, 0, 0)'; ctx.lineWidth = 18; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
            ctx.beginPath(); path(currentLandBorders); ctx.stroke();
            
            ctx.globalCompositeOperation = 'lighten'; 
            ctx.strokeStyle = 'rgb(0, 0, 255)'; ctx.lineWidth = 18; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
            ctx.beginPath();
            userPaths.forEach(pts => {
                const firstPt = map.latLngToContainerPoint(pts[0]); ctx.moveTo(firstPt.x, firstPt.y);
                for (let i = 1; i < pts.length; i++) { const p = map.latLngToContainerPoint(pts[i]); ctx.lineTo(p.x, p.y); }
            });
            ctx.stroke();

            const imgData = ctx.getImageData(0, 0, size.x, size.y).data;
            let targetPixels = 0, playerPixels = 0, intersection = 0;
            
            for (let i = 0; i < imgData.length; i += 4) {
                let r = imgData[i] > 0; let b = imgData[i+2] > 0;
                if (r) targetPixels++; if (b) playerPixels++; if (r && b) intersection++;
            }

            let precision = playerPixels === 0 ? 0 : intersection / playerPixels;
            let recall = targetPixels === 0 ? 0 : intersection / targetPixels;
            let f1 = (precision + recall === 0) ? 0 : 2 * (precision * recall) / (precision + recall);

            let scorePct = Math.min(100, (f1 * 100) * (activeMode === 'chrono' ? 1.2 : 1.4));
            if (scorePct >= 90) scorePct = 100;

            let basePoints = Math.round((scorePct / 100) * maxPointsRound);
            
            const comboBadge = document.getElementById('combo-badge');
            if (scorePct >= 75 && hintLevel === 0) {
                comboCount++;
                currentMultiplier = 1.0 + (comboCount * 0.2);
                comboBadge.innerText = `🔥 x${currentMultiplier.toFixed(1)}`;
                comboBadge.classList.add('active');
            } else {
                comboCount = 0;
                currentMultiplier = 1.0;
                comboBadge.classList.remove('active');
            }

            let finalPoints = Math.round(basePoints * currentMultiplier);
            totalScore += finalPoints;

            playSfxScore();

            document.getElementById('score-val').innerText = totalScore.toLocaleString();
            updateGlossyGauge((round / 5) * 100); // La jauge monte vers le haut à chaque manche

            targetLayer = L.geoJSON(currentLandBorders, { style: { color: '#10B981', weight: 5, dashArray: '8, 10' } }).addTo(map);

            const t = i18n[currentLang];
            let msg = scorePct >= 95 ? t.msgPerfect : scorePct > 70 ? t.msgGood : scorePct > 40 ? t.msgOkay : t.msgBad;
            
            document.getElementById('dopa-pct').innerText = `${Math.round(scorePct)}%`;
            document.getElementById('dopa-pct').style.color = scorePct > 70 ? 'var(--primary)' : (scorePct > 40 ? 'white' : 'var(--danger)');
            document.getElementById('dopa-pts').innerText = `+ ${finalPoints.toLocaleString()} pts`;
            document.getElementById('dopa-msg').innerText = msg;
            
            const popup = document.getElementById('dopamine-popup');
            popup.style.display = "flex"; setTimeout(() => popup.classList.add('active'), 100);
        }

        function nextRound() { round++; startRound(); }

        function endGame() {
            document.getElementById('game-ui').style.display = "none"; document.getElementById('score-ui').style.display = "none";
            document.getElementById('glossy-gauge').style.display = 'none';
            document.getElementById('astuce-panel').style.display = 'none';
            document.getElementById('dopamine-popup').classList.remove('active');
            setTimeout(() => document.getElementById('dopamine-popup').style.display = "none", 300);
            
            const t = i18n[currentLang];
            const overlay = document.getElementById('loading-overlay'); overlay.style.display = "flex";
            document.querySelector('.overlay-title').innerText = t.endBilan;
            document.getElementById('instructions-content').innerHTML = `${t.endScore}<b style="color:var(--primary); font-size:2rem;">${totalScore.toLocaleString()} pts</b><br><br>${activeMode === 'chrono' ? t.endDescChrono : t.endDescZenReal}`;
            document.getElementById('menu-buttons').style.display = "flex";
        }
    </script>
</body>
</html>
