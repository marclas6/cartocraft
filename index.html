<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CartoCraft - Final</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
    <style>
        :root { --primary: #FACC15; --success: #10B981; --glass-bg: rgba(15, 23, 42, 0.9); }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: #000; overflow: hidden; }
        #map-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; touch-action: none; }
        .ui-panel { position: absolute; z-index: 1000; color: white; background: var(--glass-bg); padding: 10px 15px; border-radius: 12px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .top-bar { top: 15px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 15px; }
        .flag { font-size: 1.5rem; }
        .astuce-bar { top: 75px; left: 50%; transform: translateX(-50%); font-size: 0.7rem; color: #94A3B8; text-transform: uppercase; letter-spacing: 1px; }
        .hints-bar { top: 105px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; }
        .score-bar { top: 15px; left: 15px; }
        .gauge-bar { top: 15px; right: 15px; height: 200px; width: 20px; padding: 4px; display: flex; align-items: flex-end; }
        .gauge-fill { width: 100%; background: linear-gradient(to top, #10B981, #FACC15); border-radius: 6px; transition: height 1s ease-out; }
        .btn { padding: 8px 16px; border-radius: 20px; border: none; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 0.7rem; }
        .btn-validate { background: var(--primary); }
    </style>
</head>
<body>
    <div id="map-container"></div>
    <div class="ui-panel top-bar" id="ui-top">
        <span id="flag" class="flag"></span>
        <span id="name" style="font-weight: 900; font-size: 1.2rem;"></span>
    </div>
    <div class="ui-panel astuce-bar" id="ui-astuce">Astuce :</div>
    <div class="ui-panel hints-bar" id="ui-hints">
        <button class="btn" onclick="triggerHint(1)">Centre</button>
        <button class="btn" onclick="triggerHint(2)">Voisins</button>
    </div>
    <div class="ui-panel score-bar">Score: <span id="score">0</span></div>
    <div class="ui-panel gauge-bar"><div id="gauge" class="gauge-fill" style="height: 0%;"></div></div>
    
    <script>
        const map = L.map('map-container', { zoomControl: false, dragging: true }).setView([20, 0], 3);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let currentCountry;
        const countryData = {
            "France": ["🇫🇷", "France"],
            "Germany": ["🇩🇪", "Allemagne"],
            "Italy": ["🇮🇹", "Italie"]
        };

        function updateDisplay(name) {
            const data = countryData[name] || ["🌐", name];
            document.getElementById('flag').innerText = data[0];
            document.getElementById('name').innerText = data[1];
        }

        // Fix de dessin : Empêche le drag si on dessine
        map.on('mousedown', () => map.dragging.disable());
        map.on('mouseup', () => map.dragging.enable());
        map.on('touchstart', () => map.dragging.disable());
        map.on('touchend', () => map.dragging.enable());

        function updateGauge(round) {
            document.getElementById('gauge').style.height = (round * 20) + "%";
        }

        // Initialisation test
        updateDisplay("France");
        updateGauge(1);
    </script>
</body>
</html>
